<!-- =====================================================
     DOCTORS
===================================================== -->

<section
    class="doctors section"
    id="doctors"
>

    <div class="doctors-header reveal">

        <div>

            <p class="eyebrow">
                OUR TEAM
            </p>

            <h2>
                Meet our team
                <span>
                    of specialists.
                </span>
            </h2>

        </div>

        <button
            class="doctors-toggle"
            id="doctorsToggle"
            type="button"
            aria-expanded="false"
            aria-controls="doctorsContainer"
        >

            <span class="toggle-text">
                Meet Our Team of Specialists
            </span>

            <span class="toggle-icon">
                +
            </span>

        </button>

    </div>


    <div
        class="doctors-container"
        id="doctorsContainer"
    >

        <div class="doctor-grid">


            <!-- DR VRINDA -->

            <article class="doctor-card">

                <div class="doctor-image">

                    <img
                        src="assets/dr-vrinda.png"
                        alt="Dr. Vrinda G Krishnan"
                        loading="lazy"
                    >

                    <div class="doctor-overlay">
                        <span>01</span>
                    </div>

                </div>

                <div class="doctor-info">

                    <h3>
                        Dr. Vrinda G Krishnan
                    </h3>

                    <p>
                        Founder & Chief Dental Surgeon
                    </p>

                </div>

            </article>



            <!-- DR ANGELA -->

            <article class="doctor-card">

                <div class="doctor-image">

                    <img
                        src="assets/dr-angela-sasthri-rajan.jpg"
                        alt="Dr. Angela Sasthri Rajan"
                        loading="lazy"
                    >

                    <div class="doctor-overlay">
                        <span>02</span>
                    </div>

                </div>

                <div class="doctor-info">

                    <h3>
                        Dr. Angela Sasthri Rajan
                    </h3>

                    <p>
                        Dental Specialist
                    </p>

                </div>

            </article>



            <!-- DR AFNA -->

            <article class="doctor-card">

                <div class="doctor-image">

                    <img
                        src="assets/dr-afna.png"
                        alt="Dr. Afna Nazar Sahib"
                        loading="lazy"
                    >

                    <div class="doctor-overlay">
                        <span>03</span>
                    </div>

                </div>

                <div class="doctor-info">

                    <h3>
                        Dr. Afna Nazar Sahib
                    </h3>

                    <p>
                        Dental Specialist
                    </p>

                </div>

            </article>


        </div>

    </div>

</section>
